name: checkpoint gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/unit tests/contract -q
      - run: python test_party.py

  party:
    # party games end to end (in-process, no network, no spend); kept apart
    # from the python job so a red avatar/golden test can't hide them
    runs-on: ubuntu-latest
    env:
      PARTY_TTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/contract/test_party_games.py -q
      - run: |
          python test_party.py
          python test_quip_clash.py
          python test_freeze_night.py
          python test_solo_night.py
          python test_allbots.py

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema
      - run: python scripts/validate_contracts.py

  formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema
      - run: |
          python scripts/freak_format.py test formats/comedy.open-mic
          python scripts/freak_format.py test formats/poetry.slam

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python app.py & sleep 4
      - run: python -m pytest tests/e2e -q
